# Blocks AI-tool attribution in commit messages and PR text (project convention:
# no Co-authored-by for assistants, no "Generated with X" / "🤖 Generated" lines).

name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  no-ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages and PR text
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='Co-authored-by:.*(claude|copilot|codex|cursor|chatgpt|gpt-|anthropic|openai|devin|windsurf)|Generated with \[?Claude|🤖 Generated|Generated by (Claude|Copilot|Codex|ChatGPT)'

          echo "$PR_TITLE
          $PR_BODY" > /tmp/pr-text.txt

          if grep -Eqi "$PATTERN" /tmp/pr-text.txt; then
            echo "::error::PR title/description contains AI tool attribution, which this repo's convention disallows."
            grep -Eni "$PATTERN" /tmp/pr-text.txt
            exit 1
          fi

          git log --format='%H %B' "$BASE_SHA..$HEAD_SHA" > /tmp/commit-messages.txt

          if grep -Eqi "$PATTERN" /tmp/commit-messages.txt; then
            echo "::error::A commit message in this PR contains AI tool attribution, which this repo's convention disallows."
            grep -Eni "$PATTERN" /tmp/commit-messages.txt
            exit 1
          fi

          echo "No AI attribution found."
